[package]
name = "fts-rs"
version = "0.1.0"
edition = "2024"
default-run = "fts-rs"

[dependencies]
dotenvy = "0.15.7"
chrono = "0.4"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
reqwest = { version = "0.13.4", features = ["blocking", "query", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "1", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
futures-util = "0.3"
url = "2"
